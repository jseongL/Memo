<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">
        
        
        
       <section class="contents d-flex justify-content-center" layout:fragment="contents">
        	<div class="contents-box my-5">
        		<h1 class="text-center">메모 리스트</h1>
        		<table class="table text-center mt-3">
        			<thead>
        				<tr>
        					<th>No</th>
        					<th>제목</th>
        					<th>직성 날짜</th>
        				</tr>
        			</thead>
        			
        			<tbody>
        				<tr th:each="post:${postList}">
        					<td th:text="${post.id}">234</td>
        					<td th:text="${post.title}"><a th:href="|/post/detail-view?id=${post.id}|" th:text="${post.title}">메모 예시</a></td>
        					<td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">2025-0101</td>
        				</tr>
        				
        			</tbody>
        		</table>
        		
        		<div class="d-flex justify-content-end mt-3">
        			<a href="/post/create-view"><button type="button" class="btn btn-secondary">메모 쓰기</button></a>
        		</div>
        		
        		
        		
        	</div>
        </section>
        
        
        
        
        
        
</html>
