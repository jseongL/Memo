<html lang="ko" 
    xmlns:th="http://www.thymeleaf.org" 
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">
        
        
        
        <section class="contents d-flex justify-content-center" layout:fragment="contents">
        	<div class="contents-box my-5">
        		<h1 class="text-center">메모 입력</h1>
        		<input id="titleInput" type="text" class="form-control mt-4" placeHolder="제목을 입력하세요.">
        		<textarea id="contentsInput" class="form-control mt-2" rows="10" placeHolder="내용을 입력하세요."></textarea>
        		<input type="file" class="mt-2">
        		<div class="d-flex justify-content-between mt-2">
        			<a href="/post/list-view"><button class="btn btn-secondary">목록으로</button></a>
        			<button id="saveBtn" type="button" class="btn btn-secondary">저장하기</button>
        		</div>
        	</div>
        </section>
        
        
        
        <script layout:fragment="script">
        	$(function(){
        		$("#saveBtn").on("click", function(){
        			let title = $("#titleInput").val();
        			let contents = $("#contentsInput").val();
        			
        			if(title == ""){
        				alert("제목을 입력하세요");
        				return;
        			}
        			if(contents == ""){
        				alert("내용을 입력하세요");
        				return;
        			}
        			
        			$.ajax({
        				type:`post`
        				,url:"/post/create"
        				,data:{"title":title, "contents":contents}
        				,success:function(response){
        					if(response.result == "success"){
        						location.href = "/post/list-view";
        					}
        					else{
        						alert("메모작성 실패");
        					}
        				}
        				,error:function(){
        					alert("메모작성 에러");
        				}
        			})
        			
        			
        			
        		});
        		
        		
        	});
        </script>
        
        
        
        
        
        
        
        
        
        
        
        
        
        
        
</html>
